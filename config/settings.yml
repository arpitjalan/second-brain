plugins:
  second_brain_enabled:
    default: true
    client: true
  # --- term-llm connection (the brain) ---
  # Server-only: the plugin calls term-llm from Ruby; no client code reads this.
  # Not client-exposed, so the private endpoint isn't disclosed to every visitor.
  second_brain_term_llm_url:
    default: ""
  second_brain_term_llm_api_key:
    default: ""
    secret: true
  second_brain_term_llm_model:
    default: ""
  # Abort a streaming reply after this many seconds with NO bytes at all from
  # term-llm on the socket, freeing the Sidekiq worker. term-llm sends a keepalive
  # ping every ~20s while a run is live, so this fires on a dead/hung connection,
  # not on a slow-but-alive run — no need to size it to your longest silent tool.
  second_brain_stream_idle_timeout:
    default: 300
    min: 30
    max: 3600
  # --- chat (PM-backed) ---
  second_brain_bot_username:
    default: "stan"
    client: true
  # Server-only: consumed by ChatsController#make_public; no client code reads it.
  second_brain_public_category:
    default: ""
    type: category
  # How many results the "Search AI chats" page shows.
  second_brain_search_results:
    default: 8
    min: 1
    max: 50
  # Tell the bot it can act on this forum (needs the term-llm `discourse` skill
  # deployed + credentials configured on the term-llm server). Off until ready.
  second_brain_forum_actions_enabled:
    default: false
